{% extends 'base.html' %}
{% block title %}{{ title }} - Nuvana POS{% endblock %}
{% block breadcrumb %}Restaurant / {{ title }}{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body p-4 d-flex align-items-center gap-3">
    <div class="kpi-icon"><i class="bi {{ icon }}"></i></div>
    <div>
      <h1 class="h4 mb-1">{{ title }}</h1>
      <p class="text-muted mb-0">This module is enabled for this restaurant.</p>
    </div>
  </div>
</div>
{% endblock %}
